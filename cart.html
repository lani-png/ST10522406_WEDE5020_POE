<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your OffGrid Apparel shopping cart and proceed to secure checkout.">
    <meta name="keywords" content="shopping cart, checkout, OffGrid Apparel order, streetwear cart">
    <title>OffGrid Apparel - Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-cart">

    <!-- Header -->
   <header>

    <a href="index.html">
        <img class="logo" src="images/OffGrid-logo.png" alt="OffGrid Apparel logo">
    </a>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>


    <div class="header-actions">
        <!-- dynamic searchbox -->
    <div class="header-search">
    <button class="search-toggle"
            type="button"
            aria-label="Open search"
            aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 5 5"></path>
        </svg>
    </button>

    <form class="search-panel" action="search.html" method="get">
        <input
            type="search"
            id="site-search"
            name="q"
            placeholder="Search OffGrid..."
            autocomplete="off"
            aria-label="Search OffGrid Apparel">

        <div class="search-suggestions" id="search-suggestions">
            <a href="shop.html" data-search="shop products clothing">
                Shop products
            </a>
            <a href="collection.html" data-search="collection collections">
                Explore collection
            </a>
            <a href="about.html" data-search="about us brand">
                About OffGrid
            </a>
            <a href="contact.html" data-search="contact support">
                Contact us
            </a>
        </div>
    </form>
</div>


<!-- cart -->
    <a href="cart.html">
        <img class="cart" src="images/grocery-store (1).png" alt="Shopping cart">
    </a>
    </div>
    

</header>

  <main>
    <!-- Content dynamically filled by js/script.js -->
</main>

    <!-- Footer -->
    <footer>

        <p>&copy; 2026 OffGrid Apparel. All rights reserved.</p>

    </footer>
<script src="js/script.js"></script>
</body>

</html>
